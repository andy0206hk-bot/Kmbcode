<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Bus Live - 實時巴士到站與天氣看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">
    <!-- 全螢幕加載遮罩 -->
    <div id="global-loader" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center transition-all duration-500">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 rounded-full border-4 border-slate-900"></div>
            <div class="absolute inset-0 rounded-full border-4 border-t-red-600 animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="fa-solid fa-bus text-3xl text-red-500"></i>
            </div>
        </div>
        <h2 class="text-2xl font-extrabold tracking-wider text-white">正在載入九巴全量站點資料...</h2>
        <p class="text-base text-slate-500 mt-2 font-mono" id="loader-status">正在與 data.etabus.gov.hk 連接</p>
    </div>

    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-5">
            <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 w-full sm:w-auto text-left">
                <div class="flex items-center gap-4">
                    <span class="bg-red-600/10 text-red-500 border border-red-500/30 px-3 py-1 rounded-md text-xs font-black uppercase tracking-widest animate-pulse">LIVE</span>
                    <div class="text-5xl font-mono font-extrabold text-white tracking-tight" id="clock-time">--:-- --</div>
                </div>
                <div class="text-lg sm:text-xl text-slate-400 flex items-center gap-3 font-semibold flex-wrap">
                    <span id="clock-date" class="font-mono">----- --- --</span>
                    <span class="text-slate-700">|</span>
                    <span id="clock-day">----</span>
                    <span class="text-slate-700">|</span>
                    <div id="weather-widget" class="flex items-center gap-2 text-slate-300 font-semibold bg-slate-950/40 px-3 py-1.5 rounded-xl border border-slate-800/80">
                        <img id="weather-icon" src="" class="w-10 h-10 hidden" alt="天氣" onerror="this.classList.add('hidden')">
                        <span id="weather-temp" class="font-mono text-lg sm:text-xl">--°C</span>
                        <span id="weather-place" class="text-xs text-slate-500 font-semibold">青衣</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-between sm:justify-end gap-5 w-full sm:w-auto">
                <div class="bg-slate-950 px-6 py-3.5 rounded-xl border border-slate-800 flex items-center gap-4">
                    <div class="relative w-8 h-8">
                        <svg class="w-full h-full transform -rotate-90">
                            <circle cx="16" cy="16" r="13" stroke="currentColor" class="text-slate-800" stroke-width="3" fill="transparent"/>
                            <circle cx="16" cy="16" r="13" stroke="currentColor" class="text-amber-500 transition-all duration-1000" stroke-dasharray="81.7" stroke-dashoffset="0" stroke-width="3" fill="transparent" id="countdown-circle"/>
                        </svg>
                    </div>
                    <span class="text-base font-mono text-slate-300 font-bold" id="refresh-label">30秒後刷新</span>
                </div>
                
                <button id="btn-refresh-all" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all text-white px-6 py-3.5 rounded-xl text-lg font-bold flex items-center gap-3 border border-slate-700">
                    <i class="fa-solid fa-arrows-rotate text-lg" id="refresh-icon"></i> 立即同步
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
        <div class="space-y-8">
            <div class="flex justify-between items-center border-b border-slate-800 pb-5">
                <h2 class="text-2xl font-black tracking-wide flex items-center gap-3 text-white">
                    <i class="fa-solid fa-table-columns text-amber-500"></i> 實時到站監控網格
                </h2>
                <span class="text-base text-slate-500 font-semibold" id="total-monitors-count">正在同步...</span>
            </div>

            <div id="empty-state" class="hidden bg-slate-900 rounded-2xl border border-slate-800 p-16 text-center">
                <div class="w-20 h-20 bg-slate-950 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-6 border border-slate-800">
                    <i class="fa-solid fa-bus-simple text-3xl"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-300 mb-1">您的看板空空如也</h3>
            </div>

            <div id="monitors-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-10"></div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-8 px-8 text-center text-sm text-slate-600">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <p>© 2026 HK Bus Live Dashboard. 整合九巴公眾數據與香港天文台即時天氣。</p>
            <div class="text-slate-500 font-mono text-xs" id="cache-status">
                <i class="fa-solid fa-circle-notch animate-spin"></i> 載入中...
            </div>
        </div>
    </footer>

    <script>
        'use strict';
        const REFRESH_INTERVAL = 30;
        const WEATHER_INTERVAL = 30 * 60 * 1000;
        let countdown = REFRESH_INTERVAL;
        let globalTimer = null;
        let allStops = [];
        let isUpdatingAll = false;
        let stopsLoaded = false;

        // 儲存每個 monitor 的最新 ETA 資料（用於即時倒數）
        const etaCache = {}; // { monitorId: [ { etaMs, timeStr, remark }, ... ] }

        const DEFAULT_MONITORS = [
            { id: 'monitor_1', route: '44M', stopName: '青衣碼頭 (TY217)', stopNameTc: '青衣碼頭', stopNameEn: 'TSING YI FERRY', direction: '往葵涌邨方向', stopId: '' },
            { id: 'monitor_2', route: '44M', stopName: '翠怡花園 (TY243)', stopNameTc: '翠怡花園', stopNameEn: 'GREENFIELD GARDEN', direction: '往葵涌邨方向', stopId: '' }
        ];
        const monitors = DEFAULT_MONITORS;

        const $ = id => document.getElementById(id);
        const globalLoader = $('global-loader');
        const loaderStatus = $('loader-status');
        const cacheStatusEl = $('cache-status');
        const monitorsGridEl = $('monitors-grid');
        const emptyStateEl = $('empty-state');
        const totalMonitorsCountEl = $('total-monitors-count');
        const btnRefreshAllEl = $('btn-refresh-all');
        const refreshIconEl = $('refresh-icon');
        const countdownCircleEl = $('countdown-circle');
        const refreshLabelEl = $('refresh-label');

        async function fetchKmbJson(url, timeoutMs = 12000) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { method: 'GET', cache: 'no-store', signal: controller.signal });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data || !Object.prototype.hasOwnProperty.call(data, 'data')) {
                    throw new Error('API 回應格式不正確');
                }
                return data;
            } catch (err) {
                if (err.name === 'AbortError') throw new Error('連線逾時，請稍後重試');
                throw err;
            } finally {
                clearTimeout(timeout);
            }
        }

        function updateClock() {
            const now = new Date();
            $('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            $('clock-date').textContent = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            $('clock-day').textContent = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
        }

        async function fetchWeather() {
            const tempEl = $('weather-temp');
            const placeEl = $('weather-place');
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(
                    'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc',
                    { method: 'GET', cache: 'no-store', signal: controller.signal }
                );
                clearTimeout(timeout);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (Array.isArray(data.icon) && data.icon.length) {
                    const iconImg = $('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${encodeURIComponent(data.icon[0])}.png`;
                    iconImg.classList.remove('hidden');
                }

                const temps = data.temperature?.data || [];
                const target = temps.find(t => t.place === '青衣') || temps.find(t => t.place === '香港天文台') || temps[0];
                if (target && Number.isFinite(Number(target.value))) {
                    tempEl.textContent = `${target.value}°C`;
                    placeEl.textContent = target.place || '香港';
                } else {
                    tempEl.textContent = '--°C';
                    placeEl.textContent = '暫無天氣資料';
                }
            } catch (err) {
                console.warn('天氣同步失敗：', err.message || err);
                if (tempEl.textContent === '--°C') placeEl.textContent = '天氣連線失敗';
            }
        }

        async function fetchAllStops() {
            loaderStatus.textContent = '正在連接政府巴士站點資料...';
            cacheStatusEl.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> 正在連線...';
            try {
                const payload = await fetchKmbJson('https://data.etabus.gov.hk/v1/transport/kmb/stop');
                if (!Array.isArray(payload.data)) throw new Error('站點清單格式不正確');
                allStops = payload.data;
                stopsLoaded = true;
                cacheStatusEl.innerHTML = `<span class="text-emerald-500 font-semibold"><i class="fa-solid fa-circle-check"></i> ${allStops.length.toLocaleString()} 個站點已載入</span>`;
                resolveAllMonitorUuids();
                return true;
            } catch (err) {
                stopsLoaded = false;
                cacheStatusEl.innerHTML = '<span class="text-rose-500 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> 站點資料載入失敗</span>';
                loaderStatus.textContent = `載入失敗：${err.message}。可按「立即同步」重試。`;
                console.error('無法取得全港站點清單：', err);
                return false;
            }
        }

        function normalizeStopName(value) {
            return String(value || '').replace(/[\s　]/g, '').replace(/[（(].*?[）)]/g, '').trim();
        }

        function resolveStopUuid(stopName) {
            const target = normalizeStopName(stopName);
            let stop = allStops.find(item => normalizeStopName(item.name_tc) === target);
            if (!stop) {
                stop = allStops.find(item =>
                    normalizeStopName(item.name_tc).includes(target) ||
                    target.includes(normalizeStopName(item.name_tc))
                );
            }
            return stop ? stop.stop : null;
        }

        function resolveAllMonitorUuids() {
            monitors.forEach(monitor => {
                const exactName = monitor.stopNameTc || monitor.stopName;
                const uuid = resolveStopUuid(exactName);
                if (uuid) monitor.stopId = uuid;
            });
        }

        function renderDashboard() {
            monitorsGridEl.innerHTML = '';
            totalMonitorsCountEl.textContent = `共監控 ${monitors.length} 個站點`;
            if (!monitors.length) {
                emptyStateEl.classList.remove('hidden');
                monitorsGridEl.classList.add('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            monitorsGridEl.classList.remove('hidden');

            monitors.forEach(monitor => {
                const card = document.createElement('div');
                card.id = `card-${monitor.id}`;
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition-all duration-300 flex flex-col';
                card.innerHTML = `
                    <div class="bg-slate-950 p-6 border-b border-slate-800/80 flex justify-between items-center gap-4">
                        <div class="flex items-center gap-5 min-w-0">
                            <div class="bg-red-600 text-white font-black text-3xl px-5 py-2.5 rounded-xl shadow-md font-mono tracking-tighter flex items-center justify-center">${monitor.route}</div>
                            <div class="min-w-0">
                                <h3 class="font-extrabold text-white text-lg tracking-wide flex items-center gap-4 flex-wrap">
                                    <span>${monitor.stopName}</span>
                                    <span class="text-slate-400 font-semibold uppercase text-sm sm:text-base">${monitor.stopNameEn}</span>
                                </h3>
                                <p class="text-xs text-slate-500 mt-1.5 flex items-center gap-1.5 font-semibold">
                                    <i class="fa-solid fa-circle-chevron-right text-[10px] text-slate-600"></i>${monitor.direction}
                                </p>
                            </div>
                        </div>
                        <button type="button" data-refresh-id="${monitor.id}" class="text-slate-400 hover:text-white p-2.5 rounded-xl hover:bg-slate-800 transition-colors" title="立即更新此站">
                            <i class="fa-solid fa-arrows-rotate text-lg" id="sync-icon-${monitor.id}"></i>
                        </button>
                    </div>
                    <div class="p-6 flex-grow bg-slate-900/40 overflow-hidden">
                        <div class="w-full overflow-x-auto">
                            <table class="w-full text-left text-base min-w-[300px]">
                                <thead class="text-sm uppercase text-slate-500 border-b border-slate-800/50">
                                    <tr>
                                        <th class="pb-4 font-bold tracking-wider">班次</th>
                                        <th class="pb-4 font-bold tracking-wider text-center">預計時間</th>
                                        <th class="pb-4 font-bold tracking-wider text-right">剩餘時間</th>
                                    </tr>
                                </thead>
                                <tbody id="eta-list-${monitor.id}" class="divide-y divide-slate-800/30">
                                    <tr><td colspan="3" class="py-16 text-center text-slate-400 text-lg">等待載入實時數據...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="bg-slate-950/80 border-t border-slate-800/50 px-6 py-4 flex justify-between items-center text-xs sm:text-sm text-slate-500 font-mono font-medium">
                        <span>站點 ID: <span id="stop-id-${monitor.id}">${monitor.stopId ? monitor.stopId.slice(0,8)+'…' : '待解析'}</span></span>
                        <span id="update-time-${monitor.id}">待同步</span>
                    </div>`;
                monitorsGridEl.appendChild(card);
            });

            monitorsGridEl.querySelectorAll('[data-refresh-id]').forEach(btn => {
                btn.addEventListener('click', () => updateSingleEta(btn.dataset.refreshId));
            });
        }

        function showEtaMessage(listEl, message, isError = false) {
            listEl.innerHTML = `
                <tr>
                    <td colspan="3" class="py-16 text-center ${isError ? 'text-rose-500' : 'text-slate-400'} text-lg">
                        <i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-clock'} text-2xl mb-3 block"></i>
                        ${message}
                    </td>
                </tr>`;
        }

        // ========== 核心：即時倒數渲染 ==========
        function renderEtaList(monitorId) {
            const listEl = $(`eta-list-${monitorId}`);
            if (!listEl) return;

            const arrivals = etaCache[monitorId] || [];
            const nowMs = Date.now();

            // 過濾已過站超過 30 秒的班次
            const validArrivals = arrivals.filter(a => (a.etaMs - nowMs) > -30000);

            if (!validArrivals.length) {
                showEtaMessage(listEl, '目前沒有可用的到站預報（可能未有班次或資料暫缺）');
                return;
            }

            listEl.innerHTML = validArrivals.map((eta, index) => {
                const diffMs = eta.etaMs - nowMs;
                const totalSeconds = Math.max(0, Math.floor(diffMs / 1000));
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;

                let remainingText;
                let timeClass;

                if (diffMs <= 0) {
                    remainingText = '即將抵達';
                    timeClass = 'text-emerald-400 text-3xl';
                } else if (minutes === 0) {
                    remainingText = `${seconds} 秒`;
                    timeClass = 'text-emerald-400 text-3xl';
                } else if (minutes < 3) {
                    remainingText = `${minutes} 分 ${String(seconds).padStart(2, '0')} 秒`;
                    timeClass = index === 0 ? 'text-emerald-400 text-3xl' : 'text-amber-500 text-2xl';
                } else {
                    remainingText = `${minutes} 分鐘`;
                    timeClass = index === 0 ? 'text-emerald-400 text-4xl' : 'text-amber-500 text-3xl';
                }

                const badge = index === 0
                    ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                    : index === 1
                        ? 'bg-amber-500/15 text-amber-500 border border-amber-500/30'
                        : 'bg-slate-800/80 text-slate-400 border border-slate-700/50';

                return `
                    <tr class="hover:bg-slate-900/50 transition-colors">
                        <td class="py-6">
                            <span class="px-4 py-2 text-base sm:text-lg font-black rounded ${badge}">第 ${index + 1} 班</span>
                        </td>
                        <td class="py-6 text-center text-slate-200 font-mono font-bold text-2xl">${eta.timeStr}</td>
                        <td class="py-6 text-right">
                            <div class="${timeClass} font-extrabold font-mono tracking-tight" data-eta-ms="${eta.etaMs}">${remainingText}</div>
                            <div class="text-xs text-slate-500 font-semibold mt-1">${eta.remark}</div>
                        </td>
                    </tr>`;
            }).join('');
        }

        // 每秒更新所有剩餘時間
        function tickAllEtas() {
            Object.keys(etaCache).forEach(monitorId => {
                renderEtaList(monitorId);
            });
        }

        async function updateSingleEta(id) {
            const monitor = monitors.find(item => item.id === id);
            if (!monitor) return;

            const listEl = $(`eta-list-${id}`);
            const timeEl = $(`update-time-${id}`);
            const syncIcon = $(`sync-icon-${id}`);
            if (!listEl || !timeEl) return;

            if (syncIcon) syncIcon.classList.add('animate-spin', 'text-amber-500');

            try {
                if (!stopsLoaded || !allStops.length) {
                    const ok = await fetchAllStops();
                    if (ok && monitorsGridEl.children.length === 0) renderDashboard();
                }

                if (!monitor.stopId) {
                    monitor.stopId = resolveStopUuid(monitor.stopNameTc || monitor.stopName);
                }
                if (!monitor.stopId) {
                    throw new Error(`找不到「${monitor.stopNameTc}」站點。請確認站名或稍後重試。`);
                }

                const payload = await fetchKmbJson(
                    `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${encodeURIComponent(monitor.stopId)}`
                );
                if (!Array.isArray(payload.data)) throw new Error('ETA 回應格式不正確');

                const nowMs = Date.now();
                const seen = new Set();
                const arrivals = payload.data
                    .filter(item => item.route === monitor.route && item.eta)
                    .map(item => {
                        const etaMs = Date.parse(item.eta);
                        if (!Number.isFinite(etaMs)) return null;
                        if (etaMs - nowMs < -30000) return null;
                        const key = `${item.route}|${item.eta}|${item.dest_tc || ''}`;
                        if (seen.has(key)) return null;
                        seen.add(key);
                        return {
                            etaMs,
                            timeStr: new Date(etaMs).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }),
                            remark: item.rmk_tc || '實時預報'
                        };
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.etaMs - b.etaMs)
                    .slice(0, 5);

                // 更新快取
                etaCache[id] = arrivals;

                // 立即渲染一次
                renderEtaList(id);

                const stopIdEl = $(`stop-id-${id}`);
                if (stopIdEl) stopIdEl.textContent = monitor.stopId.slice(0, 8) + '…';
                timeEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> 更新：${new Date().toLocaleTimeString('en-GB', { hour12: false })}`;
            } catch (err) {
                console.error(`更新 ${monitor.stopName} ETA 失敗：`, err);
                showEtaMessage(listEl, err.message || '連線伺服器失敗，請稍後重試', true);
                timeEl.innerHTML = '<span class="text-rose-500 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> 更新失敗</span>';
                delete etaCache[id];
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin', 'text-amber-500');
            }
        }

        async function updateAllEtas() {
            if (isUpdatingAll) return;
            isUpdatingAll = true;
            btnRefreshAllEl.disabled = true;
            refreshIconEl.classList.add('animate-spin');
            try {
                if (!stopsLoaded) {
                    const ok = await fetchAllStops();
                    if (ok) {
                        resolveAllMonitorUuids();
                        renderDashboard();
                    }
                }
                await Promise.all(monitors.map(monitor => updateSingleEta(monitor.id)));
            } finally {
                isUpdatingAll = false;
                btnRefreshAllEl.disabled = false;
                refreshIconEl.classList.remove('animate-spin');
            }
        }

        function startTimer() {
            if (globalTimer) clearInterval(globalTimer);
            countdown = REFRESH_INTERVAL;
            globalTimer = setInterval(() => {
                updateClock();
                tickAllEtas(); // ← 每秒更新剩餘時間

                countdown = Math.max(0, countdown - 1);
                const fraction = countdown / REFRESH_INTERVAL;
                countdownCircleEl.style.strokeDashoffset = String(81.7 * (1 - fraction));
                refreshLabelEl.textContent = `${countdown}秒後刷新`;

                if (countdown <= 0) {
                    countdown = REFRESH_INTERVAL;
                    updateAllEtas().catch(err => console.error('自動更新失敗：', err));
                }
            }, 1000);
        }

        btnRefreshAllEl.addEventListener('click', async () => {
            countdown = REFRESH_INTERVAL;
            await fetchWeather();
            await updateAllEtas();
        });

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            fetchWeather();
            setInterval(fetchWeather, WEATHER_INTERVAL);

            const success = await fetchAllStops();
            renderDashboard();

            globalLoader.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => globalLoader.classList.add('hidden'), 500);

            if (success) {
                await updateAllEtas();
            } else {
                monitors.forEach(m => {
                    const el = $(`eta-list-${m.id}`);
                    if (el) showEtaMessage(el, '站點資料載入失敗；請按「立即同步」重試。', true);
                });
            }
            startTimer();
        }

        init().catch(err => {
            console.error('初始化失敗：', err);
            loaderStatus.textContent = `初始化失敗：${err.message || '未知錯誤'}`;
            globalLoader.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => globalLoader.classList.add('hidden'), 500);
            startTimer();
        });
    </script>
</body>
</html>
