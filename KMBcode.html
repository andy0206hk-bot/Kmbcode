<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Bus Live - 實時巴士到站與天氣看板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 數位字型風格 -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'led': '0 0 15px rgba(245, 158, 11, 0.6), 0 0 4px rgba(245, 158, 11, 0.4)',
                        'led-green': '0 0 15px rgba(16, 185, 129, 0.6), 0 0 4px rgba(16, 185, 129, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        /* 清晰扁平色彩，無光暈 */
        .led-text {
            text-shadow: none;
        }
        .led-green-text {
            text-shadow: none;
        }
        
        /* 徹底隱藏全局與局部滾動條，確保排版乾淨無阻 */
        *::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        * {
            -ms-overflow-style: none !important;  /* IE and Edge */
            scrollbar-width: none !important;  /* Firefox */
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- 全螢幕加載遮罩 -->
    <div id="global-loader" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center transition-all duration-500">
        <div class="relative w-24 h-24 mb-6">
            <div class="absolute inset-0 rounded-full border-4 border-slate-900"></div>
            <div class="absolute inset-0 rounded-full border-4 border-t-red-600 animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="fa-solid fa-bus text-3xl text-red-500"></i>
            </div>
        </div>
        <h2 class="text-2xl font-extrabold tracking-wider text-white">正在載入九巴全量站點資料...</h2>
        <p class="text-base text-slate-500 mt-2 font-mono" id="loader-status">正在與 data.etabus.gov.hk 連接</p>
    </div>

    <!-- 導航欄 -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-5">
            
            <!-- 實時時間/日期/星期/天文台天氣 看板組 (全面放大) -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 w-full sm:w-auto text-left">
                <div class="flex items-center gap-4">
                    <span class="bg-red-600/10 text-red-500 border border-red-500/30 px-3 py-1 rounded-md text-xs font-black uppercase tracking-widest animate-pulse">LIVE</span>
                    <div class="text-5xl font-mono font-extrabold text-white tracking-tight" id="clock-time">
                        --:-- --
                    </div>
                </div>
                <div class="text-lg sm:text-xl text-slate-400 flex items-center gap-3 font-semibold flex-wrap">
                    <span id="clock-date" class="font-mono">----- --- --</span>
                    <span class="text-slate-700">|</span>
                    <span id="clock-day">----</span>
                    <span class="text-slate-700">|</span>
                    
                    <!-- 香港天文台實時天氣小工具 (青衣分區溫度) -->
                    <div id="weather-widget" class="flex items-center gap-2 text-slate-300 font-semibold bg-slate-950/40 px-3 py-1.5 rounded-xl border border-slate-800/80">
                        <img id="weather-icon" src="" class="w-10 h-10 hidden" alt="天氣" onerror="this.classList.add('hidden')">
                        <span id="weather-temp" class="font-mono text-lg sm:text-xl">--°C</span>
                        <span id="weather-place" class="text-xs text-slate-500 font-semibold">青衣</span>
                    </div>
                </div>
            </div>
            
            <!-- 全局計時器與控制項 (對應截圖位置，全面放大) -->
            <div class="flex items-center justify-between sm:justify-end gap-5 w-full sm:w-auto">
                <div class="bg-slate-950 px-6 py-3.5 rounded-xl border border-slate-800 flex items-center gap-4">
                    <div class="relative w-8 h-8">
                        <svg class="w-full h-full transform -rotate-90">
                            <circle cx="16" cy="16" r="13" stroke="currentColor" class="text-slate-800" stroke-width="3" fill="transparent"/>
                            <!-- 81.7 圓周對應半徑 13 (2 * PI * 13) -->
                            <circle cx="16" cy="16" r="13" stroke="currentColor" class="text-amber-500 transition-all duration-1000" stroke-dasharray="81.7" stroke-dashoffset="0" stroke-width="3" fill="transparent" id="countdown-circle"/>
                        </svg>
                    </div>
                    <span class="text-base font-mono text-slate-300 font-bold" id="refresh-label">30秒後刷新</span>
                </div>
                
                <button id="btn-refresh-all" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all text-white px-6 py-3.5 rounded-xl text-lg font-bold flex items-center gap-3 border border-slate-700">
                    <i class="fa-solid fa-arrows-rotate text-lg" id="refresh-icon"></i> 立即同步
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
        <div class="space-y-8">
            <div class="flex justify-between items-center border-b border-slate-800 pb-5">
                <h2 class="text-2xl font-black tracking-wide flex items-center gap-3 text-white">
                    <i class="fa-solid fa-table-columns text-amber-500"></i> 實時到站監控網格
                </h2>
                <span class="text-base text-slate-500 font-semibold" id="total-monitors-count">正在同步...</span>
            </div>

            <!-- 空狀態提示 -->
            <div id="empty-state" class="hidden bg-slate-900 rounded-2xl border border-slate-800 p-16 text-center">
                <div class="w-20 h-20 bg-slate-950 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-6 border border-slate-800">
                    <i class="fa-solid fa-bus-simple text-3xl"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-300 mb-1">您的看板空空如也</h3>
            </div>

            <!-- 監控卡片網格 (雙卡滿版寬度) -->
            <div id="monitors-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <!-- 卡片模板會動態渲染於此 -->
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-8 px-8 text-center text-sm text-slate-600">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <p>© 2026 HK Bus Live Dashboard. 整合九巴公眾數據與香港天文台即時天氣。</p>
            <div class="text-slate-500 font-mono text-xs" id="cache-status">
                <i class="fa-solid fa-circle-notch animate-spin"></i> 載入中...
            </div>
        </div>
    </footer>

    <script>
        const REFRESH_INTERVAL = 30; // 30 秒更新一次巴士 ETA
        let countdown = REFRESH_INTERVAL;
        let globalTimer = null;
        let allStops = []; // 全港巴士站緩存 (快取大資料)

        // 固定監控配置：青衣碼頭與翠怡花園
        const DEFAULT_MONITORS = [
            {
                id: "monitor_1",
                route: "44M",
                stopName: "青衣碼頭 (TY217)",
                stopNameEn: "TSING YI FERRY",
                direction: "往葵涌邨方向"
            },
            {
                id: "monitor_2",
                route: "44M",
                stopName: "翠怡花園 (TY243)",
                stopNameEn: "GREENFIELD GARDEN",
                direction: "往葵涌邨方向"
            }
        ];

        let monitors = DEFAULT_MONITORS;

        // DOM 元素引用
        const globalLoader = document.getElementById('global-loader');
        const loaderStatus = document.getElementById('loader-status');
        const cacheStatusEl = document.getElementById('cache-status');
        const monitorsGridEl = document.getElementById('monitors-grid');
        const emptyStateEl = document.getElementById('empty-state');
        const totalMonitorsCountEl = document.getElementById('total-monitors-count');
        const btnRefreshAllEl = document.getElementById('btn-refresh-all');
        const refreshIconEl = document.getElementById('refresh-icon');
        const countdownCircleEl = document.getElementById('countdown-circle');
        const refreshLabelEl = document.getElementById('refresh-label');

        // 1. 動態更新導航時鐘功能 (實時每秒更新)
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = days[now.getDay()];
            
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0點應顯示為12點
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const timeStr = `${hours}:${minutes} ${ampm}`;
            const dateStr = `${year}-${month}-${date}`;
            
            document.getElementById('clock-time').textContent = timeStr;
            document.getElementById('clock-date').textContent = dateStr;
            document.getElementById('clock-day').textContent = dayName;
        }

        // 2. 獲取香港天文台實時天氣與分區溫度
        async function fetchWeather() {
            try {
                const response = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
                const data = await response.json();
                
                // A. 更新天氣ICON (使用天文台官方Outline圖標，更簡潔好看)
                if (data.icon && data.icon.length > 0) {
                    const iconId = data.icon[0];
                    const iconImg = document.getElementById('weather-icon');
                    iconImg.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png`;
                    iconImg.classList.remove('hidden');
                }
                
                // B. 精確查找「青衣」分區氣溫，若無數據則回退到「香港天文台」市區溫度
                if (data.temperature && data.temperature.data) {
                    let targetTemp = data.temperature.data.find(t => t.place === "青衣");
                    if (!targetTemp) {
                        targetTemp = data.temperature.data.find(t => t.place === "香港天文台") || data.temperature.data[0];
                    }
                    
                    if (targetTemp) {
                        document.getElementById('weather-temp').textContent = `${targetTemp.value}°C`;
                        document.getElementById('weather-place').textContent = targetTemp.place;
                    }
                }
            } catch (err) {
                console.error("無法同步天文台天氣數據", err);
            }
        }

        // 3. 初始化系統：讀取全港巴士站清單
        async function fetchAllStops() {
            try {
                loaderStatus.textContent = "正在向政府 Open Data 伺服器載入全港巴士站清單...";
                cacheStatusEl.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> 正在連線...`;
                
                const response = await fetch("https://data.etabus.gov.hk/v1/transport/kmb/stop");
                const resData = await response.json();
                allStops = resData.data;
                
                cacheStatusEl.innerHTML = `<span class="text-emerald-500 font-semibold"><i class="fa-solid fa-circle-check"></i> ${allStops.length.toLocaleString()} 個站點已載入</span>`;
                return true;
            } catch (err) {
                cacheStatusEl.innerHTML = `<span class="text-rose-500 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> 載入失敗</span>`;
                loaderStatus.textContent = "❌ 無法取得全港站點清單，請檢查網路連線。";
                console.error("無法取得全港站點清單", err);
                return false;
            }
        }

        // 4. 核心精確名稱 UUID 轉碼器：比對 name_tc 完全等於目標字串
        function resolveStopUuid(stopName) {
            const stopInfo = allStops.find(stop => stop.name_tc === stopName);
            return stopInfo ? stopInfo.stop : null;
        }

        // 當載入完成後，確保所有 monitor 都有正確的 16 位元 stopId UUID
        function resolveAllMonitorUuids() {
            monitors.forEach(monitor => {
                if (!monitor.stopId || monitor.stopId.length !== 16) {
                    const uuid = resolveStopUuid(monitor.stopName);
                    if (uuid) {
                        monitor.stopId = uuid;
                    }
                }
            });
        }

        // 5. 渲染看板骨架 (中英文同大小橫向並排，站點與英文恢復精簡尺寸)
        function renderDashboard() {
            monitorsGridEl.innerHTML = '';
            totalMonitorsCountEl.textContent = `共監控 ${monitors.length} 個站點`;

            if (monitors.length === 0) {
                emptyStateEl.classList.remove('hidden');
                monitorsGridEl.classList.add('hidden');
                return;
            }

            emptyStateEl.classList.add('hidden');
            monitorsGridEl.classList.remove('hidden');

            monitors.forEach(monitor => {
                const card = document.createElement('div');
                card.id = `card-${monitor.id}`;
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition-all duration-300 flex flex-col no-scrollbar";
                card.innerHTML = `
                    <!-- 卡片頂部 -->
                    <div class="bg-slate-950 p-6 border-b border-slate-800/80 flex justify-between items-center gap-4">
                        <div class="flex items-center gap-5">
                            <!-- 巴士號碼 Badge (保持放大) -->
                            <div class="bg-red-600 text-white font-black text-3xl px-5 py-2.5 rounded-xl shadow-md font-mono tracking-tighter flex items-center justify-center">
                                ${monitor.route}
                            </div>
                            <div>
                                <!-- 中英文橫向並排 (按用戶需求，文字維持原經典大小 text-lg，英文 text-sm) -->
                                <h3 class="font-extrabold text-white text-lg tracking-wide flex items-center gap-4 flex-wrap">
                                    <span>${monitor.stopName.split(' ')[0]}</span>
                                    <span class="text-slate-400 font-semibold uppercase text-sm sm:text-base">${monitor.stopNameEn || ''}</span>
                                </h3>
                                <p class="text-xs text-slate-500 mt-1.5 flex items-center gap-1.5 font-semibold">
                                    <i class="fa-solid fa-circle-chevron-right text-[10px] text-slate-600"></i>${monitor.direction}
                                </p>
                            </div>
                        </div>
                        <div>
                            <button onclick="updateSingleEta('${monitor.id}')" class="text-slate-400 hover:text-white p-2.5 rounded-xl hover:bg-slate-800 transition-colors" title="立即手動更新">
                                <i class="fa-solid fa-arrows-rotate text-lg" id="sync-icon-${monitor.id}"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 到站列表內容區 (全面放大 LED 時間，首班 text-4xl，其餘 text-3xl) -->
                    <div class="p-6 flex-grow bg-slate-900/40 no-scrollbar overflow-hidden">
                        <div class="w-full overflow-x-auto no-scrollbar">
                            <table class="w-full text-left text-base min-w-[300px]">
                                <thead class="text-sm uppercase text-slate-500 border-b border-slate-800/50">
                                    <tr>
                                        <th class="pb-4 font-bold tracking-wider">班次</th>
                                        <th class="pb-4 font-bold tracking-wider text-center">預計時間</th>
                                        <th class="pb-4 font-bold tracking-wider text-right">剩餘時間</th>
                                    </tr>
                                </thead>
                                <tbody id="eta-list-${monitor.id}" class="divide-y divide-slate-800/30">
                                    <tr>
                                        <td colspan="3" class="py-16 text-center text-slate-400 text-lg">
                                            <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-3 block text-amber-500"></i>正在載入實時數據...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 底部 UUID 與更新狀態 -->
                    <div class="bg-slate-950/80 border-t border-slate-800/50 px-6 py-4 flex justify-between items-center text-xs sm:text-sm text-slate-500 font-mono font-medium">
                        <span>站點 ID: ${monitor.stopId ? monitor.stopId.substring(0,8) + '...' : '等待解析'}</span>
                        <span id="update-time-${monitor.id}">待同步</span>
                    </div>
                `;
                monitorsGridEl.appendChild(card);
            });
        }

        // 6. 抓取單卡 ETA 數據並進行純數值排序與渲染
        async function updateSingleEta(id) {
            const monitor = monitors.find(m => m.id === id);
            if (!monitor) return;

            const listEl = document.getElementById(`eta-list-${id}`);
            const timeEl = document.getElementById(`update-time-${id}`);
            const syncIcon = document.getElementById(`sync-icon-${id}`);

            if (syncIcon) syncIcon.classList.add('animate-spin', 'text-amber-500');

            if (!monitor.stopId || monitor.stopId.length !== 16) {
                const uuid = resolveStopUuid(monitor.stopName);
                if (uuid) {
                    monitor.stopId = uuid;
                } else {
                    listEl.innerHTML = `
                        <tr>
                            <td colspan="3" class="py-16 text-center text-rose-500 text-lg">
                                <i class="fa-solid fa-circle-exclamation text-2xl mb-2 block"></i>名稱解析失敗，無法查詢。
                            </td>
                        </tr>
                    `;
                    if (syncIcon) syncIcon.classList.remove('animate-spin', 'text-amber-500');
                    return;
                }
            }

            try {
                // 使用極速單站點 ETA API
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${monitor.stopId}`);
                const resData = await response.json();
                
                // 過濾該站點中對應路線的數據
                const routeEta = resData.data.filter(item => item.route === monitor.route);
                
                const now = new Date();
                const processedList = [];

                routeEta.forEach(item => {
                    if (!item.eta) return;
                    const etaTime = new Date(item.eta);
                    const diffMs = etaTime - now;
                    const minutesLeft = Math.round(diffMs / 1000 / 60);

                    // 精準過濾：只保留還沒離開的班次 (剩餘時間 >= 0 分鐘)
                    if (minutesLeft >= 0) {
                        processedList.push({
                            sortMinutes: minutesLeft, // 用於純數值排序
                            timeStr: etaTime.toTimeString().substring(0, 5),
                            rmk: item.rmk_tc || '即時班次'
                        });
                    }
                });

                // 核心：依據剩餘時間由小到大排序
                processedList.sort((a, b) => a.sortMinutes - b.sortMinutes);

                // 渲染至 HTML (大字體 LED 設計：首班 4xl，次班 3xl)
                if (processedList.length === 0) {
                    listEl.innerHTML = `
                        <tr>
                            <td colspan="3" class="py-16 text-center text-slate-400 text-lg font-bold">
                                <i class="fa-regular fa-clock text-2xl mb-3 block text-slate-500"></i>服務已結束或近期無班次
                            </td>
                        </tr>
                    `;
                } else {
                    listEl.innerHTML = '';
                    processedList.forEach((eta, index) => {
                        let badgeColor = "bg-slate-800/80 text-slate-400 border border-slate-700/50";
                        if (index === 0) badgeColor = "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";
                        else if (index === 1) badgeColor = "bg-amber-500/15 text-amber-500 border border-amber-500/30";

                        // LED 樣式配置：第一班綠色，後續琥珀色 (字體再放大，首班 4xl，後續 3xl)
                        const isFirst = index === 0;
                        const ledTextClass = isFirst ? "led-green-text text-emerald-400 font-extrabold font-mono text-4xl" : "led-text text-amber-500 font-extrabold font-mono text-3xl";
                        const minutesDisplay = eta.sortMinutes === 0 ? "即將抵達" : `${eta.sortMinutes} 分鐘`;

                        listEl.innerHTML += `
                            <tr class="hover:bg-slate-900/50 transition-colors">
                                <td class="py-6">
                                    <span class="px-4 py-2 text-base sm:text-lg font-black rounded ${badgeColor}">
                                        第 ${index + 1} 班
                                    </span>
                                </td>
                                <td class="py-6 text-center text-slate-200 font-mono font-bold text-2xl">${eta.timeStr}</td>
                                <td class="py-6 text-right">
                                    <div class="${ledTextClass} tracking-tight">
                                        ${minutesDisplay}
                                    </div>
                                    <div class="text-xs text-slate-500 font-semibold mt-1">${eta.rmk}</div>
                                </td>
                            </tr>
                        `;
                    });
                }

                timeEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> 同步時間: ${now.toTimeString().substring(0, 8)}`;

            } catch (err) {
                console.error("更新單卡 ETA 失敗", err);
                listEl.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-16 text-center text-rose-500 text-lg">
                            <i class="fa-solid fa-circle-xmark text-2xl mb-2 block"></i>連線伺服器失敗
                        </td>
                    </tr>
                `;
                timeEl.innerHTML = `<span class="text-rose-500 font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> 錯誤</span>`;
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin', 'text-amber-500');
            }
        }

        // 7. 全局刷新所有監控
        async function updateAllEtas() {
            btnRefreshAllEl.disabled = true;
            refreshIconEl.classList.add('animate-spin');
            
            const promises = monitors.map(m => updateSingleEta(m.id));
            await Promise.all(promises);
            
            btnRefreshAllEl.disabled = false;
            refreshIconEl.classList.remove('animate-spin');
        }

        // 8. 定時倒數機制 (30秒) 與時鐘刷新 (1秒)
        function startTimer() {
            if (globalTimer) clearInterval(globalTimer);
            
            // 每秒觸發的計時器，用於更新時鐘與倒數
            globalTimer = setInterval(() => {
                // 更新時鐘
                updateClock();
                
                // 減少倒數時間
                countdown--;
                
                // 更新計時器圈圈百分比 (使用 81.7 作為最大圓周)
                const offset = (countdown / REFRESH_INTERVAL) * 81.7;
                countdownCircleEl.style.strokeDashoffset = 81.7 - offset;
                refreshLabelEl.textContent = `${countdown}秒後刷新`;

                if (countdown <= 0) {
                    countdown = REFRESH_INTERVAL;
                    updateAllEtas();
                }
            }, 1000);
        }

        // 天氣獨立計時器 (每 30 分鐘 / 1800 秒在背景重刷一次天文台數據)
        setInterval(fetchWeather, 1800000);

        // 手動更新按鈕事件
        btnRefreshAllEl.addEventListener('click', () => {
            countdown = REFRESH_INTERVAL;
            updateAllEtas();
            fetchWeather(); // 手動更新時也順便刷新天氣
        });

        // 9. 初始化啟動函數
        async function init() {
            // A. 第一步：先加載時鐘與實時天氣
            updateClock();
            fetchWeather();
            
            // B. 第二步：先加載全量巴士靜態資料
            const success = await fetchAllStops();
            
            if (success) {
                // C. 第三步：將 "青衣碼頭" / "翠怡花園" 轉換為系統 UUID
                resolveAllMonitorUuids();
                
                // D. 第四步：渲染前端卡片，關閉載入遮罩
                renderDashboard();
                
                // 漸變消失動畫
                globalLoader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    globalLoader.classList.add('hidden');
                }, 500);

                // E. 第五步：立即進行實時同步並啟用 30 秒自動刷新與時鐘計時器
                updateAllEtas();
                startTimer();
            }
        }

        // 執行
        init();
    </script>
</body>
</html>
